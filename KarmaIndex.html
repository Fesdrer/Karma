<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业力值模拟器</title>
<style>
/* ============ Reset & Base ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #1a1a2e; color: #e0e0e0; min-height: 100vh; overflow-x: hidden;
}
button { cursor: pointer; font-family: inherit; border: none; outline: none; }
input, select { font-family: inherit; outline: none; }

/* ============ Views ============ */
.view { display: none; width: 100%; min-height: 100dvh; }
.view.active { display: flex; flex-direction: column; }

/* ============ Main View ============ */
#view-main {
  max-width: 1200px; margin: 0 auto; padding: 12px; gap: 12px;
  height: 100vh; min-height: 100vh;
}

/* Header */
#header {
  text-align: center; padding: 10px 14px;
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  flex-shrink: 0;
}
#score-display {
  font-size: clamp(22px, 5vw, 44px); font-weight: 800;
  letter-spacing: 1px;
}
#score-display .score-num { color: #ffd700; }
#score-display .rank-name {
  font-size: 0.5em; background: rgba(255,215,0,0.15);
  padding: 2px 12px; border-radius: 20px; color: #ffd700;
  vertical-align: middle; margin-left: 8px;
}
#score-display .no-rank { color: #888; font-size: 0.4em; }

/* Main Content: Three columns */
#main-content {
  display: flex; gap: 12px; flex: 1; min-height: 0;
}
.panel {
  background: #16213e; border-radius: 12px; padding: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  display: flex; flex-direction: column;
}
.panel-title {
  font-size: 12px; font-weight: 700; color: #ffd700;
  margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
}
.panel-title button {
  font-size: 11px; padding: 2px 8px; border-radius: 5px;
  background: #0f3460; color: #a0c4ff; transition: all 0.2s;
}
.panel-title button:hover { background: #1a4a8a; color: #fff; }

/* Left panel - Score */
#left-panel { flex: 1; min-width: 0; }
.score-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
  overflow-y: auto; flex: 1;
}
.score-btn {
  padding: 6px 2px; border-radius: 7px; font-size: 13px; font-weight: 700;
  background: #1a1a3e; color: #a0c4ff; border: 2px solid transparent;
  transition: all 0.15s; text-align: center;
}
.score-btn:hover { background: #252550; }
.score-btn.selected { border-color: #ffd700; color: #ffd700; background: rgba(255,215,0,0.1); }
.score-btn.neg { color: #ff8a80; }
.score-btn.neg.selected { border-color: #ff5252; color: #ff5252; background: rgba(255,82,82,0.1); }
.custom-score-row {
  display: flex; gap: 5px; margin-top: 6px;
}
.custom-score-row input {
  flex: 1; padding: 4px 8px; border-radius: 7px; border: 1px solid #334;
  background: #1a1a3e; color: #e0e0e0; font-size: 12px;
}
.custom-score-row input:focus { border-color: #ffd700; }

/* Center panel - Axis (narrow strip) */
#center-panel {
  width: 75px; min-width: 60px; flex-shrink: 0; position: relative;
  overflow: hidden; padding: 0;
}
#axis-canvas { display: block; width: 100%; height: 100%; }

/* Right panel - Event */
#right-panel { flex: 1; min-width: 0; }
.event-list {
  display: flex; flex-direction: column; gap: 5px;
  overflow-y: auto; flex: 1;
}
.event-btn {
  padding: 6px 8px; border-radius: 7px; font-size: 12px;
  background: #1a1a3e; color: #a0c4ff; border: 2px solid transparent;
  transition: all 0.15s; text-align: left; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.event-btn:hover { background: #252550; }
.event-btn.selected { border-color: #ffd700; color: #ffd700; background: rgba(255,215,0,0.1); }
.custom-event-row {
  display: flex; gap: 6px; margin-top: 8px;
}
.custom-event-row input {
  flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid #334;
  background: #1a1a3e; color: #e0e0e0; font-size: 14px;
}
.custom-event-row input:focus { border-color: #ffd700; }

/* Footer - Action Buttons */
#footer {
  display: flex; gap: 8px; justify-content: center; align-items: center;
  padding: 8px 10px; flex-shrink: 0;
}
.action-btn {
  padding: 10px 20px; border-radius: 10px; font-size: 15px; font-weight: 700;
  transition: all 0.2s; letter-spacing: 1px;
}
#btn-confirm {
  background: linear-gradient(135deg, #4a90d9, #357abd);
  color: #fff; flex: 1; max-width: 300px;
}
#btn-confirm:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,144,217,0.4); }
#btn-confirm:disabled { background: #333; color: #666; cursor: not-allowed; }
#btn-prayer {
  background: linear-gradient(135deg, #d4a017, #b8860b);
  color: #fff;
}
#btn-prayer:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,160,23,0.4); }
#btn-prayer:disabled { background: #333; color: #666; cursor: not-allowed; }
#btn-history {
  background: #333; color: #a0c4ff;
}
#btn-history:hover { background: #444; }

/* ============ Modal ============ */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.7);
  justify-content: center; align-items: center;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: #16213e; border-radius: 16px; padding: 24px;
  width: 90vw; max-width: 500px; max-height: 80vh;
  display: flex; flex-direction: column;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.modal-box h2 { color: #ffd700; margin-bottom: 16px; font-size: 20px; }
.modal-body { flex: 1; overflow-y: auto; margin-bottom: 16px; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; }
.modal-footer button {
  padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
}
.btn-close { background: #333; color: #aaa; }
.btn-close:hover { background: #444; color: #fff; }
.btn-save { background: #4a90d9; color: #fff; }
.btn-save:hover { background: #357abd; }

.preset-edit-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid #1a1a3e;
}
.preset-edit-item .val {
  flex: 1; font-size: 15px; padding: 4px 8px;
  background: #1a1a3e; border-radius: 6px; color: #e0e0e0;
}
.preset-edit-item .val input {
  width: 100%; background: transparent; border: none; color: inherit; font-size: 15px; padding: 2px;
}
.preset-edit-item .btn-del { color: #ff5252; font-size: 18px; padding: 4px 8px; background: transparent; }
.preset-edit-item .btn-del:hover { background: rgba(255,82,82,0.15); }
.preset-edit-item .btn-move { color: #888; font-size: 14px; padding: 4px; background: transparent; }
.preset-edit-item .btn-move:hover { color: #fff; }
.add-preset-row {
  display: flex; gap: 8px; margin-top: 12px;
}
.add-preset-row input {
  flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #334;
  background: #1a1a3e; color: #e0e0e0; font-size: 14px;
}
.add-preset-row button {
  padding: 8px 16px; border-radius: 8px; background: #4a90d9; color: #fff; font-weight: 600;
}
.add-preset-row button:hover { background: #357abd; }

/* History Detail Tooltip */
.tooltip {
  display: none; position: fixed; z-index: 500;
  background: #0f3460; border: 1px solid #334; border-radius: 10px;
  padding: 12px 16px; font-size: 13px; line-height: 1.6;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4); pointer-events: none;
  max-width: 280px;
}
.tooltip.visible { display: block; }
.tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; }
.tooltip .tt-label { color: #888; }
.tooltip .tt-val { color: #e0e0e0; font-weight: 600; }
.tooltip .tt-val.pos { color: #69f0ae; }
.tooltip .tt-val.neg { color: #ff5252; }

/* ============ History View ============ */
#view-history {
  max-width: 1000px; margin: 0 auto; padding: 20px; height: 100vh;
}
#view-history header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
#view-history header h1 { color: #ffd700; font-size: 24px; }
.hist-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hist-controls button {
  padding: 6px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
  background: #1a1a3e; color: #a0c4ff; border: 1px solid #334;
  transition: all 0.15s;
}
.hist-controls button:hover { background: #252550; }
.hist-controls button.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }
.hist-controls .back-btn { background: #333; color: #aaa; }
.hist-controls .back-btn:hover { background: #444; color: #fff; }
#chart-wrapper {
  background: #0d1b2a; border-radius: 16px; padding: 12px;
  flex: 1; position: relative; min-height: 400px;
}
#chart-canvas { display: block; width: 100%; height: 100%; min-height: 400px; }

/* ============ Prayer View ============ */
#view-prayer {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.85);
  justify-content: center; align-items: center;
  overflow: hidden;
}
#prayer-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none;
}
.prayer-form {
  position: relative; z-index: 10;
  background: #16213e; border-radius: 20px; padding: 32px;
  width: 90vw; max-width: 420px; text-align: center;
  box-shadow: 0 10px 60px rgba(0,0,0,0.6);
}
.prayer-form h2 { color: #ffd700; font-size: 24px; margin-bottom: 8px; }
.prayer-form .sub { color: #888; font-size: 14px; margin-bottom: 20px; }
.prayer-form label { display: block; text-align: left; color: #aaa; font-size: 13px; margin-bottom: 4px; }
.prayer-form input {
  width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #334;
  background: #1a1a3e; color: #e0e0e0; font-size: 16px; margin-bottom: 16px;
}
.prayer-form input:focus { border-color: #ffd700; }
.prayer-form .prayer-actions { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
.prayer-form .prayer-actions button {
  padding: 10px 28px; border-radius: 10px; font-size: 16px; font-weight: 700;
}
#btn-prayer-cancel { background: #333; color: #aaa; }
#btn-prayer-cancel:hover { background: #444; color: #fff; }
#btn-prayer-confirm { background: linear-gradient(135deg, #d4a017, #b8860b); color: #fff; }
#btn-prayer-confirm:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,160,23,0.4); }

/* Prayer input bracket decorator */
.prayer-input-wrap {
  display: flex; align-items: center; gap: 0;
  margin-bottom: 16px;
  background: #1a1a3e; border-radius: 10px; border: 1px solid #334;
  overflow: hidden;
}
.prayer-input-wrap:focus-within { border-color: #ff0000; }
.prayer-bracket {
  font-size: 22px; font-weight: 700; color: #ff0000;
  padding: 10px 4px; user-select: none; flex-shrink: 0;
  background: #1a1a3e;
}
.prayer-bracket.left { padding-left: 10px; }
.prayer-bracket.right { padding-right: 10px; }
#prayer-purpose {
  flex: 1; border: none !important; border-radius: 0 !important;
  background: transparent !important; color: #ff0000 !important;
  font-size: 16px; padding: 10px 4px; margin: 0 !important;
  outline: none;
}
#prayer-purpose::placeholder { color: #666 !important; }
.prayer-input-wrap:focus-within .prayer-bracket { color: #ff4444; }

/* ============ Scrollbar ============ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #334; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #446; }

/* ============ Responsive ============ */
@media (max-width: 400px) {
  #view-main { padding: 6px; gap: 6px; }
  #main-content { gap: 6px; }
  #center-panel { width: 55px; min-width: 50px; }
  .panel { padding: 6px; }
  .score-grid { grid-template-columns: 1fr 1fr; gap: 3px; }
  .score-btn { font-size: 11px; padding: 4px 1px; }
  .event-btn { font-size: 11px; padding: 4px 6px; }
  #btn-confirm { padding: 8px 12px; font-size: 13px; }
  #btn-prayer { padding: 8px 12px; font-size: 13px; }
  #btn-history { padding: 8px 12px; font-size: 13px; }
}
</style>
</head>
<body>

<!-- ========== MAIN VIEW ========== -->
<div id="view-main" class="view active">
  <div id="header">
    <div id="score-display">
      <span class="score-num">0.0</span>
    </div>
  </div>

  <div id="main-content">
    <!-- Left Panel: Score Selection -->
    <div id="left-panel" class="panel">
      <div class="panel-title">
        <span>分数</span>
        <button id="btn-edit-scores">编辑</button>
      </div>
      <div class="score-grid" id="score-grid"></div>
      <div class="custom-score-row">
        <input type="text" id="custom-score" placeholder="自定义分数..." />
      </div>
    </div>

    <!-- Center Panel: Axis -->
    <div id="center-panel" class="panel">
      <canvas id="axis-canvas"></canvas>
    </div>

    <!-- Right Panel: Event Selection -->
    <div id="right-panel" class="panel">
      <div class="panel-title">
        <span>事件</span>
        <button id="btn-edit-events">编辑</button>
      </div>
      <div class="event-list" id="event-list"></div>
      <div class="custom-event-row">
        <input type="text" id="custom-event" placeholder="自定义事件..." />
      </div>
    </div>
  </div>

  <div id="footer">
    <button id="btn-confirm" class="action-btn" disabled>确认</button>
    <button id="btn-prayer" class="action-btn" disabled>祈福</button>
    <button id="btn-history" class="action-btn">历史</button>
  </div>
</div>

<!-- ========== HISTORY VIEW ========== -->
<div id="view-history" class="view">
  <header>
    <h1>历史记录</h1>
    <div class="hist-controls">
      <button class="back-btn" id="hist-back">← 返回</button>
      <button class="active" data-mode="day">日</button>
      <button data-mode="week">周</button>
      <button data-mode="month">月</button>
      <button id="btn-export-csv">CSV</button>
      <button id="btn-export-json">JSON</button>
      <button id="btn-import">导入</button>
      <input type="file" id="file-input" accept=".json,.csv" style="display:none" />
    </div>
  </header>
  <div id="chart-wrapper">
    <canvas id="chart-canvas"></canvas>
  </div>
</div>

<!-- ========== PRAYER VIEW ========== -->
<div id="view-prayer" class="view">
  <canvas id="prayer-canvas"></canvas>
  <div class="prayer-form">
    <h2>🙏 祈福</h2>
    <p class="sub">诚心祈福，扣减业力值</p>
    <label>扣减分数</label>
    <input type="number" id="prayer-amount" placeholder="输入正数..." min="0.1" step="0.1" />
    <label>祈福目的</label>
    <div class="prayer-input-wrap">
      <span class="prayer-bracket left">「</span>
      <input type="text" id="prayer-purpose" placeholder="输入祈福内容..." />
      <span class="prayer-bracket right">」</span>
    </div>
    <div class="prayer-actions">
      <button id="btn-prayer-cancel">取消</button>
      <button id="btn-prayer-confirm">确认祈福</button>
    </div>
  </div>
</div>

<!-- ========== MODAL: Score Edit ========== -->
<div class="modal-overlay" id="modal-score-edit">
  <div class="modal-box">
    <h2>编辑预设分数</h2>
    <div class="modal-body" id="score-edit-list"></div>
    <div class="add-preset-row">
      <input type="text" id="score-add-input" placeholder="输入新分数..." />
      <button id="score-add-btn">添加</button>
    </div>
    <div class="modal-footer">
      <button class="btn-close" onclick="App.closeModal('modal-score-edit')">取消</button>
      <button class="btn-save" onclick="App.saveScorePresets()">保存</button>
    </div>
  </div>
</div>

<!-- ========== MODAL: Event Edit ========== -->
<div class="modal-overlay" id="modal-event-edit">
  <div class="modal-box">
    <h2>编辑预设事件</h2>
    <div class="modal-body" id="event-edit-list"></div>
    <div class="add-preset-row">
      <input type="text" id="event-add-input" placeholder="输入新事件..." />
      <button id="event-add-btn">添加</button>
    </div>
    <div class="modal-footer">
      <button class="btn-close" onclick="App.closeModal('modal-event-edit')">取消</button>
      <button class="btn-save" onclick="App.saveEventPresets()">保存</button>
    </div>
  </div>
</div>

<!-- ========== TOOLTIP ========== -->
<div class="tooltip" id="tooltip"></div>

<script>
// ================================================================
//  KARMA (业力值) SIMULATOR — Full Application
// ================================================================

const App = (function() {

  // ============================================================
  //  CONSTANTS
  // ============================================================
  const RANKS = [
    { min: 0,   max: 10,   level: 1, name: '壹阶', color: '#0055ff' },
    { min: 10,  max: 30,   level: 2, name: '贰阶', color: '#0077ff' },
    { min: 30,  max: 60,   level: 3, name: '叁阶', color: '#0099ff' },
    { min: 60,  max: 100,  level: 4, name: '肆阶', color: '#00bbff' },
    { min: 100, max: 150,  level: 5, name: '伍阶', color: '#00ddaa' },
    { min: 150, max: 210,  level: 6, name: '陆阶', color: '#44dd44' },
    { min: 210, max: 280,  level: 7, name: '柒阶', color: '#ddaa00' },
    { min: 280, max: 360,  level: 8, name: '捌阶', color: '#ff5500' },
    { min: 360, max: Infinity, level: 9, name: '玖阶', color: '#ff0000' },
  ];
  const RANK_COLORS = [
    '#0055ff', '#0077ff', '#0099ff', '#00bbff', '#00ddaa',
    '#44dd44', '#ddaa00', '#ff5500', '#ff0000'
  ];
  const NEG_BG = '#2d2d2d';
  const AXIS_DISPLAY_RANGE = 100; // ±100
  const ANIM_DURATION = 400; // ms
  const MAX_HISTORY = 2000;

  // ============================================================
  //  STATE MANAGER
  // ============================================================
  const StateManager = {
    data: null,

    defaults() {
      return {
        totalScore: 0,
        history: [],
        nextHistoryId: 1,
        scorePresets: [-2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2],
        eventPresets: ['帮助他人', '早起早睡', '锻炼身体', '发脾气', '浪费粮食', '口出恶言'],
      };
    },

    load() {
      try {
        const raw = localStorage.getItem('karmaData');
        if (raw) {
          const d = JSON.parse(raw);
          // Ensure all keys exist
          const def = this.defaults();
          for (const k of Object.keys(def)) {
            if (d[k] === undefined) d[k] = def[k];
          }
          this.data = d;
        } else {
          this.data = this.defaults();
        }
      } catch (e) {
        console.warn('localStorage read failed, using defaults:', e);
        this.data = this.defaults();
      }
    },

    save() {
      try {
        localStorage.setItem('karmaData', JSON.stringify(this.data));
      } catch (e) {
        console.warn('localStorage write failed:', e);
      }
    },

    getRank(score) {
      if (score < 0) return null;
      return RANKS.find(r => score >= r.min && score < r.max) || null;
    },

    addHistory(delta, event, type) {
      const d = this.data;
      d.totalScore = Math.round((d.totalScore + delta) * 10) / 10;
      const entry = {
        id: d.nextHistoryId++,
        timestamp: Date.now(),
        delta: Math.round(delta * 10) / 10,
        event: event,
        type: type || 'record',
        totalAfter: d.totalScore,
      };
      d.history.push(entry);
      // Cap history
      if (d.history.length > MAX_HISTORY) {
        d.history.splice(0, d.history.length - MAX_HISTORY);
      }
      this.save();
      return entry;
    },

    exportData(format) {
      const d = this.data;
      if (format === 'json') {
        return JSON.stringify({ totalScore: d.totalScore, history: d.history }, null, 2);
      }
      // CSV
      let csv = 'timestamp,delta,event,totalAfter,type\n';
      for (const h of d.history) {
        const ev = '"' + (h.event||'').replace(/"/g, '""') + '"';
        csv += `${h.timestamp},${h.delta},${ev},${h.totalAfter},${h.type}\n`;
      }
      return csv;
    },

    importData(raw, format) {
      try {
        if (format === 'json') {
          const d = JSON.parse(raw);
          if (typeof d.totalScore !== 'number' || !Array.isArray(d.history)) {
            throw new Error('Invalid format');
          }
          this.data.totalScore = d.totalScore;
          this.data.history = d.history;
          this.data.nextHistoryId = d.history.length > 0
            ? Math.max(...d.history.map(h => h.id)) + 1 : 1;
          this.save();
          return true;
        } else {
          // CSV parse
          const lines = raw.trim().split('\n');
          if (lines.length < 2) throw new Error('Empty CSV');
          const header = lines[0].split(',');
          const history = [];
          let maxId = 0;
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length < 5) continue;
            const entry = {
              id: parseInt(cols[0]) || i,
              timestamp: parseFloat(cols[1]) || 0,
              delta: parseFloat(cols[2]) || 0,
              event: cols[3] ? cols[3].replace(/^"|"$/g, '') : '',
              type: (cols[4] || 'record').trim(),
              totalAfter: 0,
            };
            history.push(entry);
            if (entry.id > maxId) maxId = entry.id;
          }
          // Recalculate totalAfter
          let total = 0;
          history.sort((a, b) => a.timestamp - b.timestamp);
          for (const h of history) {
            total += h.delta;
            h.totalAfter = Math.round(total * 10) / 10;
          }
          this.data.totalScore = Math.round(total * 10) / 10;
          this.data.history = history;
          this.data.nextHistoryId = maxId + 1;
          this.save();
          return true;
        }
      } catch (e) {
        console.warn('Import failed:', e);
        return false;
      }
    },
  };

  // ============================================================
  //  AXIS RENDERER
  // ============================================================
  const AxisRenderer = {
    canvas: null,
    ctx: null,
    animState: null,
    currentScore: 0,

    init(canvas) {
      this.canvas = canvas;
      this.animState = { running: false, from: 0, to: 0, startTime: 0 };
    },

    setupCanvas() {
      const c = this.canvas;
      const rect = c.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = rect.width;
      const h = rect.height;
      if (w === 0 || h === 0) return null;
      c.width = w * dpr;
      c.height = h * dpr;
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      this.ctx = ctx;
      return { w, h };
    },

    // Score → canvas Y (logical pixels)
    scoreToY(score, centerScore, halfH, canvasH) {
      const d = score - centerScore;
      const sign = Math.sign(d);
      const absD = Math.min(Math.abs(d), AXIS_DISPLAY_RANGE * 2);
      const scale = halfH / Math.pow(AXIS_DISPLAY_RANGE, 0.6);
      const pixelOffset = sign * Math.pow(absD, 0.6) * scale;
      return canvasH / 2 - pixelOffset;
    },

    // Canvas Y → score (inverse)
    yToScore(canvasY, centerScore, halfH, canvasH) {
      const pixelOffset = canvasH / 2 - canvasY;
      const sign = Math.sign(pixelOffset);
      const absPixels = Math.abs(pixelOffset);
      const scale = halfH / Math.pow(AXIS_DISPLAY_RANGE, 0.6);
      if (scale === 0) return centerScore;
      const absD = Math.pow(absPixels / scale, 1 / 0.6);
      return centerScore + sign * absD;
    },

    render(centerScore, w, h) {
      const ctx = this.ctx;
      if (!ctx) return;
      const halfH = h / 2;
      const axisX = Math.round(w / 2); // vertical center of the narrow strip

      // Tick dimensions
      const TICK_MAJOR = 7;  // half-length of major tick (extends both sides)
      const TICK_MINOR = 4;  // half-length of minor tick

      // ---- 1. Clear ----
      ctx.clearRect(0, 0, w, h);

      // ---- 2. Base background ----
      ctx.fillStyle = '#0d1b2a';
      ctx.fillRect(0, 0, w, h);

      // ---- 3. Negative region ----
      const zeroY = this.scoreToY(0, centerScore, halfH, h);
      if (centerScore - AXIS_DISPLAY_RANGE < 0) {
        const negY = Math.max(0, Math.min(zeroY, h));
        if (h > negY) {
          ctx.fillStyle = NEG_BG;
          ctx.fillRect(0, negY, w, h - negY);
        }
      }

      // ---- 4. Rank bands (full width) ----
      const minVis = centerScore - AXIS_DISPLAY_RANGE;
      const maxVis = centerScore + AXIS_DISPLAY_RANGE;
      for (const rank of RANKS) {
        const bt = Math.max(rank.min, minVis);
        const bb = Math.min(rank.max, maxVis);
        if (bt >= bb) continue;
        const yT = this.scoreToY(bb, centerScore, halfH, h);
        const yB = this.scoreToY(bt, centerScore, halfH, h);
        const y0 = Math.max(0, Math.min(yT, yB));
        const y1 = Math.min(h, Math.max(yT, yB));
        if (y1 <= y0) continue;
        ctx.fillStyle = rank.color;
        ctx.fillRect(0, y0, w, y1 - y0);
      }

      // ---- 5. Tick marks + labels ----
      const idealTicks = 16;
      const rawInterval = (AXIS_DISPLAY_RANGE * 2) / idealTicks;
      const niceIntervals = [1, 2, 5, 10, 20, 50];
      let tickInterval = niceIntervals[0];
      let minDiff = Infinity;
      for (const ni of niceIntervals) {
        const diff = Math.abs(ni - rawInterval);
        if (diff < minDiff) { minDiff = diff; tickInterval = ni; }
      }

      const firstTick = Math.ceil(minVis / tickInterval) * tickInterval;
      const lastTick = Math.floor(maxVis / tickInterval) * tickInterval;
      const minorInterval = tickInterval <= 1 ? 0.5 : tickInterval / 2;
      const drawMinor = tickInterval > 1 && minorInterval >= 0.5;

      // Major ticks + labels
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      for (let s = firstTick; s <= lastTick + 0.001; s += tickInterval) {
        const y = this.scoreToY(s, centerScore, halfH, h);
        if (y < -8 || y > h + 8) continue;
        // Major tick (centered on axisX)
        ctx.beginPath();
        ctx.moveTo(axisX - TICK_MAJOR, y);
        ctx.lineTo(axisX + TICK_MAJOR, y);
        ctx.stroke();
        // Label to the left of the left tick end
        const label = Number.isInteger(s) ? s.toString() : s.toFixed(1);
        ctx.fillText(label, axisX - TICK_MAJOR - 3, y);
      }

      // Minor ticks
      if (drawMinor) {
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        for (let s = Math.ceil(minVis / minorInterval) * minorInterval;
             s <= maxVis; s += minorInterval) {
          if (Math.abs(s % tickInterval) < 0.001) continue;
          const y = this.scoreToY(s, centerScore, halfH, h);
          if (y < -8 || y > h + 8) continue;
          ctx.beginPath();
          ctx.moveTo(axisX - TICK_MINOR, y);
          ctx.lineTo(axisX + TICK_MINOR, y);
          ctx.stroke();
        }
      }

      // ---- 6. Axis line (vertical through center) ----
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(axisX, 0);
      ctx.lineTo(axisX, h);
      ctx.stroke();

      // ---- 7. Fixed pointer at center ----
      const ptrY = h / 2;

      // Full-width dashed guide line
      ctx.strokeStyle = 'rgba(255,215,0,0.5)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(0, ptrY);
      ctx.lineTo(w, ptrY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Triangle pointer at right edge
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.moveTo(w - 3, ptrY);
      ctx.lineTo(w - 13, ptrY - 6);
      ctx.lineTo(w - 13, ptrY + 6);
      ctx.closePath();
      ctx.fill();

      // Current score label, right side of axisX (between axis and triangle)
      const scoreLabel = Number.isInteger(centerScore) ? centerScore.toString() : centerScore.toFixed(1);
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(scoreLabel, w - 16, ptrY);

      // ---- 8. Range labels at top/bottom ----
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.font = '8px sans-serif';
      ctx.textAlign = 'right';
      const topScore = centerScore + AXIS_DISPLAY_RANGE;
      const botScore = centerScore - AXIS_DISPLAY_RANGE;
      const topLabel = Number.isInteger(topScore) ? topScore.toString() : topScore.toFixed(1);
      const botLabel = Number.isInteger(botScore) ? botScore.toString() : botScore.toFixed(1);
      ctx.fillText(topLabel, axisX - TICK_MAJOR - 3, 10);
      ctx.fillText(botLabel, axisX - TICK_MAJOR - 3, h - 8);
    },

    animateToScore(newScore) {
      const state = this.animState;
      const now = performance.now();
      let fromScore;
      if (state.running) {
        // Interpolate current position
        const elapsed = now - state.startTime;
        const t = Math.min(elapsed / ANIM_DURATION, 1);
        const eased = this.easeInOutCubic(t);
        fromScore = state.from + (state.to - state.from) * eased;
      } else {
        fromScore = this.currentScore;
      }

      state.running = true;
      state.from = fromScore;
      state.to = newScore;
      state.startTime = now;
      this.currentScore = newScore;
      this.animLoop();
    },

    animLoop() {
      const state = this.animState;
      const elapsed = performance.now() - state.startTime;
      const t = Math.min(elapsed / ANIM_DURATION, 1);
      const eased = this.easeInOutCubic(t);
      const interpScore = state.from + (state.to - state.from) * eased;

      const dims = this.setupCanvas();
      if (dims) {
        this.render(interpScore, dims.w, dims.h);
      }

      if (t < 1) {
        requestAnimationFrame(() => this.animLoop());
      } else {
        state.running = false;
        // Final render at exact target
        const d2 = this.setupCanvas();
        if (d2) this.render(state.to, d2.w, d2.h);
      }
    },

    easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    },

    // Immediate render (no animation)
    renderImmediate(score) {
      this.currentScore = score;
      const dims = this.setupCanvas();
      if (dims) this.render(score, dims.w, dims.h);
    },

    handleResize() {
      if (this.animState.running) return;
      this.renderImmediate(this.currentScore);
    },
  };

  // ============================================================
  //  HISTORY CHART
  // ============================================================
  const HistoryChart = {
    canvas: null,
    ctx: null,
    viewport: null,
    data: [],
    viewMode: 'day',
    tooltipData: null,
    isPanning: false,
    panStart: { x: 0, viewStart: 0, viewEnd: 0 },

    init(canvas) {
      this.canvas = canvas;
      this.viewport = { viewStart: 0, viewEnd: 0, yMin: 0, yMax: 0 };
    },

    setupCanvas() {
      const c = this.canvas;
      const rect = c.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = rect.width;
      const h = rect.height;
      if (w < 10 || h < 10) return null;
      c.width = w * dpr;
      c.height = h * dpr;
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      this.ctx = ctx;
      return { w, h };
    },

    updateData() {
      const d = StateManager.data;
      this.data = [...d.history].sort((a, b) => a.timestamp - b.timestamp);
      if (this.data.length === 0) return;
      const vp = this.viewport;
      const padding = 0.1;
      const timeRange = this.data[this.data.length - 1].timestamp - this.data[0].timestamp;
      vp.viewStart = this.data[0].timestamp - timeRange * padding;
      vp.viewEnd = this.data[this.data.length - 1].timestamp + timeRange * padding;
      if (vp.viewEnd <= vp.viewStart) {
        vp.viewEnd = vp.viewStart + 3600000; // 1 hour min
      }
      const scores = this.data.map(d => d.totalAfter);
      const yMin = Math.min(...scores);
      const yMax = Math.max(...scores);
      const yPad = Math.max((yMax - yMin) * 0.15, 5);
      vp.yMin = yMin - yPad;
      vp.yMax = yMax + yPad;
      if (vp.yMax <= vp.yMin) { vp.yMax = vp.yMin + 10; }
    },

    getAggregatedPoints() {
      if (this.data.length === 0) return [];
      if (this.viewMode === 'day') return this.data;

      // Group by week or month
      const groups = {};
      for (const p of this.data) {
        const d = new Date(p.timestamp);
        let key;
        if (this.viewMode === 'week') {
          // ISO week: YYYY-WW
          const startOfYear = new Date(d.getFullYear(), 0, 1);
          const week = Math.ceil((((d - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
          key = d.getFullYear() + '-W' + String(week).padStart(2, '0');
        } else {
          key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        }
        // Take the last entry in each group
        groups[key] = p;
      }
      return Object.values(groups).sort((a, b) => a.timestamp - b.timestamp);
    },

    render() {
      const dims = this.setupCanvas();
      if (!dims) return;
      const { w, h } = dims;
      const ctx = this.ctx;
      const PAD = { top: 20, right: 20, bottom: 40, left: 60 };
      const points = this.getAggregatedPoints();

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#0d1b2a';
      ctx.fillRect(0, 0, w, h);

      if (points.length < 2) {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('暂无足够数据', w / 2, h / 2);
        return;
      }

      const vp = this.viewport;
      const plotW = w - PAD.left - PAD.right;
      const plotH = h - PAD.top - PAD.bottom;

      // Map functions
      const xMap = (t) => PAD.left + (t - vp.viewStart) / (vp.viewEnd - vp.viewStart) * plotW;
      const yMap = (s) => PAD.top + (1 - (s - vp.yMin) / (vp.yMax - vp.yMin)) * plotH;

      // ---- Grid lines (horizontal) ----
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      const gridLines = 5;
      for (let i = 0; i <= gridLines; i++) {
        const y = PAD.top + (i / gridLines) * plotH;
        ctx.beginPath();
        ctx.moveTo(PAD.left, y);
        ctx.lineTo(w - PAD.right, y);
        ctx.stroke();
        // Score label
        const score = vp.yMax - (i / gridLines) * (vp.yMax - vp.yMin);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(score.toFixed(1), PAD.left - 6, y);
      }

      // ---- Time labels (vertical) ----
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const timeLabels = 5;
      for (let i = 0; i <= timeLabels; i++) {
        const t = vp.viewStart + (i / timeLabels) * (vp.viewEnd - vp.viewStart);
        const x = xMap(t);
        if (x < PAD.left || x > w - PAD.right) continue;
        const d = new Date(t);
        const label = (d.getMonth() + 1) + '/' + d.getDate();
        ctx.fillText(label, x, h - PAD.bottom + 8);
      }

      // ---- Draw line ----
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        const x = xMap(points[i].timestamp);
        const y = yMap(points[i].totalAfter);
        if (x < PAD.left - 10 || x > w - PAD.right + 10) continue;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // ---- Draw dots ----
      // Draw only a subset if too many points
      const maxDots = 200;
      const step = Math.max(1, Math.floor(points.length / maxDots));
      for (let i = 0; i < points.length; i += step) {
        const x = xMap(points[i].timestamp);
        const y = yMap(points[i].totalAfter);
        if (x < PAD.left - 10 || x > w - PAD.right + 10) continue;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0d1b2a';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // ---- Area fill under line ----
      const lastIdx = points.length - 1;
      ctx.fillStyle = 'rgba(255,215,0,0.08)';
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        const x = xMap(points[i].timestamp);
        const y = yMap(points[i].totalAfter);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      const lastX = xMap(points[lastIdx].timestamp);
      ctx.lineTo(lastX, PAD.top + plotH);
      const firstX = xMap(points[0].timestamp);
      ctx.lineTo(firstX, PAD.top + plotH);
      ctx.closePath();
      ctx.fill();

      // ---- Hover tooltip ----
      this.tooltipData = { points, xMap, yMap };
    },

    getHoveredPoint(mouseX, mouseY) {
      if (!this.tooltipData) return null;
      const { points, xMap, yMap } = this.tooltipData;
      const PAD = { top: 20, right: 20, bottom: 40, left: 60 };
      for (let i = 0; i < points.length; i++) {
        const cx = xMap(points[i].timestamp);
        const cy = yMap(points[i].totalAfter);
        if (cx < PAD.left || cx > this.canvas.getBoundingClientRect().width - PAD.right) continue;
        if (Math.hypot(mouseX - cx, mouseY - cy) < 8) {
          return points[i];
        }
      }
      return null;
    },

    handlePanStart(clientX) {
      this.isPanning = true;
      this.panStart = {
        x: clientX,
        viewStart: this.viewport.viewStart,
        viewEnd: this.viewport.viewEnd,
      };
    },

    handlePanMove(clientX) {
      if (!this.isPanning) return;
      const rect = this.canvas.getBoundingClientRect();
      const dx = clientX - this.panStart.x;
      const totalW = this.panStart.viewEnd - this.panStart.viewStart;
      const plotW = rect.width - 80;
      const dt = (dx / plotW) * totalW;
      this.viewport.viewStart = this.panStart.viewStart - dt;
      this.viewport.viewEnd = this.panStart.viewEnd - dt;
      this.render();
    },

    handlePanEnd() {
      this.isPanning = false;
    },

    handleWheel(e) {
      e.preventDefault();
      const rect = this.canvas.getBoundingClientRect();
      const mouseX = e.offsetX;
      const zoomFactor = e.deltaY > 0 ? 1.12 : 0.88;
      const totalW = this.viewport.viewEnd - this.viewport.viewStart;
      const plotW = rect.width - 80;
      const mouseRatio = (mouseX - 60) / plotW;
      const mouseTime = this.viewport.viewStart + mouseRatio * totalW;
      const newW = totalW * zoomFactor;
      this.viewport.viewStart = mouseTime - mouseRatio * newW;
      this.viewport.viewEnd = this.viewport.viewStart + newW;
      this.render();
    },
  };

  // ============================================================
  //  PARTICLE ENGINE (Prayer — Karmic Threads + Rings)
  // ============================================================
  const ParticleEngine = {
    canvas: null,
    ctx: null,
    running: false,
    spawnTime: 0,
    onComplete: null,
    deduction: 0,
    purpose: '',
    rankLevel: 1,
    params: null,
    isDivine: false,
    threads: [],
    rings: [],
    sparks: [],

    init(canvas) {
      this.canvas = canvas;
      // ResizeObserver: 当画布 CSS 尺寸变化时自动同步内部分辨率
      this.resizeObserver = new ResizeObserver(() => {
        if (this.running) {
          this.syncCanvasSize();
        }
      });
      this.resizeObserver.observe(canvas);
    },

    syncCanvasSize() {
      const c = this.canvas;
      const dpr = window.devicePixelRatio || 1;
      const rect = c.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      if (w === 0 || h === 0) return;
      // 仅当尺寸确实变化时才更新
      if (c.width === w * dpr && c.height === h * dpr) return;
      c.width = w * dpr;
      c.height = h * dpr;
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.ctx = ctx;
    },

    start(amount, purpose, rankLevel, onComplete) {
      this.deduction = amount;
      this.purpose = purpose;
      this.rankLevel = rankLevel || 1;
      this.onComplete = onComplete;
      this.threads = [];
      this.rings = [];
      this.sparks = [];
      this.runes = [];
      this.running = true;
      this.spawnTime = performance.now();

      const c = this.canvas;
      const dpr = window.devicePixelRatio || 1;
      const rect = c.getBoundingClientRect();
      c.width = rect.width * dpr;
      c.height = rect.height * dpr;
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      this.ctx = ctx;

      // Tier selection
      const tier = rankLevel >= 9 ? 3 : rankLevel <= 3 ? 0 : rankLevel <= 6 ? 1 : 2;
      const TIERS = [
        { threads: 30, rings: 2, sparks: 0, duration: 3200, dark: 0.5, glow: 0, gold: 0 },
        { threads: 50, rings: 4, sparks: 25, duration: 4200, dark: 0.6, glow: 8, gold: 0.12 },
        { threads: 80, rings: 6, sparks: 65, duration: 5200, dark: 0.7, glow: 20, gold: 0.3 },
        { threads: 150, rings: 12, sparks: 160, duration: 7000, dark: 0.88, glow: 45, gold: 0.55 },
      ];
      this.params = TIERS[tier];
      this.isDivine = tier === 3;

      const cx = c.width / dpr / 2;
      const cy = c.height / dpr / 2;
      const w = c.width / dpr;
      const h = c.height / dpr;
      const diag = Math.sqrt(w * w + h * h);
      const baseScale = Math.min(w, h); // 以短边为基准，适配竖屏/横屏

      // ---- Karmic threads ----
      for (let i = 0; i < this.params.threads; i++) {
        const angle = Math.random() * Math.PI * 2;
        const finalLen = 80 + Math.random() * (baseScale * 0.45);
        const hasGold = Math.random() < this.params.gold;
        this.threads.push({
          angle,
          finalLen,
          speed: 0.5 + Math.random() * 0.7,
          cpOffset: (Math.random() - 0.5) * finalLen * 0.7,
          cp2Offset: (Math.random() - 0.5) * finalLen * 0.5,
          hue: hasGold ? 38 : Math.floor(Math.random() * 12),
          sat: hasGold ? 90 : 92 + Math.random() * 8,
          light: hasGold ? 55 + Math.random() * 20 : 30 + Math.random() * 25,
          lineWidth: 1 + Math.random() * 2.5,
          currentLen: 0,
          delay: Math.random() * 400,
        });
      }

      // ---- Expanding rings ----
      const maxRingR = baseScale * 0.42;
      for (let i = 0; i < this.params.rings; i++) {
        this.rings.push({
          finalRadius: 80 + Math.random() * maxRingR,
          speed: 0.8 + Math.random() * 1.8,
          lineWidth: 2 + Math.random() * 4,
          currentRadius: 0,
          baseOpacity: 0.4 + Math.random() * 0.35,
          delay: i * (250 + Math.random() * 300),
        });
      }

      // ---- Sacred sparks (tier 2+) ----
      for (let i = 0; i < this.params.sparks; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1.5 + Math.random() * 4.5;
        const isGold = Math.random() < this.params.gold * 1.5;
        this.sparks.push({
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          size: 1.2 + Math.random() * 3,
          hue: isGold ? 42 : Math.floor(Math.random() * 10),
          sat: isGold ? 95 : 100,
          light: isGold ? 65 : 40 + Math.random() * 25,
          life: 1, decay: 0.004 + Math.random() * 0.012,
        });
      }

      requestAnimationFrame(() => this.loop());
    },

    loop() {
      if (!this.running) return;
      // 每帧同步画布尺寸，防止视口变化导致的拉伸
      this.syncCanvasSize();
      const elapsed = performance.now() - this.spawnTime;
      const dur = this.params ? this.params.duration : 4000;
      if (elapsed > dur) {
        this.running = false;
        if (this.onComplete) this.onComplete();
        return;
      }
      this.update(elapsed);
      this.draw(elapsed);
      requestAnimationFrame(() => this.loop());
    },

    update(elapsed) {
      for (const t of this.threads) {
        if (elapsed > t.delay) {
          t.currentLen = Math.min(t.finalLen, t.currentLen + t.speed);
        }
      }
      for (const r of this.rings) {
        if (elapsed > r.delay) {
          r.currentRadius = Math.min(r.finalRadius, r.currentRadius + r.speed);
        }
      }
      for (const s of this.sparks) {
        s.x += s.vx; s.y += s.vy;
        s.life -= s.decay; s.vx *= 0.99; s.vy *= 0.99;
      }
      this.sparks = this.sparks.filter(s => s.life > 0);
    },

    draw(elapsed) {
      const ctx = this.ctx;
      const c = this.canvas;
      const dpr = window.devicePixelRatio || 1;
      const w = c.width / dpr, h = c.height / dpr;
      const diag = Math.sqrt(w * w + h * h);
      const baseScale = Math.min(w, h); // 以短边为基准
      const cx = w / 2, cy = h / 2;
      const p = this.params;
      const glow = p ? p.glow : 0;

      ctx.clearRect(0, 0, w, h);

      // Dark overlay
      const fadeIn = Math.min(elapsed / 300, 1);
      ctx.fillStyle = `rgba(0,0,0,${(p ? p.dark : 0.5) * fadeIn})`;
      ctx.fillRect(0, 0, w, h);

      // ---- Divine central halo (tier 3 only) ----
      if (this.isDivine) {
        const haloR = baseScale * 0.08 + Math.sin(elapsed / 800) * baseScale * 0.03;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, haloR + 80);
        grad.addColorStop(0, 'rgba(255,215,0,0.35)');
        grad.addColorStop(0.4, 'rgba(255,100,0,0.2)');
        grad.addColorStop(1, 'rgba(255,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(cx, cy, haloR + 80, 0, Math.PI * 2); ctx.fill();
      }

      // ---- Draw threads (bezier curves) ----
      for (const t of this.threads) {
        if (t.currentLen <= 0) continue;
        const endX = cx + Math.cos(t.angle) * t.currentLen;
        const endY = cy + Math.sin(t.angle) * t.currentLen;
        const cp1x = cx + Math.cos(t.angle + 0.6) * t.cpOffset;
        const cp1y = cy + Math.sin(t.angle + 0.6) * t.cpOffset;
        const cp2x = cx + Math.cos(t.angle - 0.4) * t.cp2Offset;
        const cp2y = cy + Math.sin(t.angle - 0.4) * t.cp2Offset;
        const alpha = Math.min(1, t.currentLen / t.finalLen * 1.4);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = `hsl(${t.hue}, ${t.sat}%, ${t.light}%)`;
        ctx.lineWidth = t.lineWidth;
        if (glow > 0) { ctx.shadowColor = `hsl(${t.hue}, 100%, 50%)`; ctx.shadowBlur = glow; }
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endX, endY);
        ctx.stroke(); ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      // ---- Draw rings ----
      for (const r of this.rings) {
        if (r.currentRadius <= 2) continue;
        const progress = r.currentRadius / r.finalRadius;
        const ringAlpha = r.baseOpacity * Math.max(0, 1 - progress * 1.1);
        if (ringAlpha <= 0) continue;
        ctx.globalAlpha = ringAlpha;
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = Math.max(1, r.lineWidth * (1 - progress * 0.7));
        if (glow > 0) { ctx.shadowColor = 'rgba(255,0,0,0.6)'; ctx.shadowBlur = glow; }
        ctx.beginPath(); ctx.arc(cx, cy, r.currentRadius, 0, Math.PI * 2);
        ctx.stroke(); ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      // ---- Divine golden rings (tier 3 only) ----
      if (this.isDivine) {
        for (let i = 0; i < 4; i++) {
          const phase = (elapsed / 1000 + i * 0.25) % 1;
          const r = 40 + phase * diag * 0.45;
          const alpha = 0.4 * (1 - phase);
          if (alpha <= 0) continue;
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = i % 2 === 0 ? '#ffd700' : '#ff6600';
          ctx.lineWidth = 3 - phase * 2;
          if (glow > 0) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = glow * 0.8; }
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke(); ctx.shadowBlur = 0;
        }
      }
      ctx.globalAlpha = 1;

      // ---- Draw sparks ----
      for (const s of this.sparks) {
        ctx.globalAlpha = Math.max(0, s.life);
        ctx.fillStyle = `hsl(${s.hue}, ${s.sat}%, ${s.light}%)`;
        if (glow > 0) { ctx.shadowColor = `hsl(${s.hue}, 100%, 60%)`; ctx.shadowBlur = glow * 0.6; }
        ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(0.4, s.size * s.life), 0, Math.PI * 2);
        ctx.fill(); ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      // ---- Sacred rune particles (tier 3 only) ----
      if (this.isDivine) {
        this.runes = this.runes || [];
        const runeChars = ['卍', '✦', '⚘', '✧', '◇', '☯'];
        if (elapsed < 2000 && Math.random() < 0.15) {
          const a = Math.random() * Math.PI * 2;
          const dist = 60 + Math.random() * 120;
          this.runes.push({
            x: cx + Math.cos(a) * dist, y: cy + Math.sin(a) * dist,
            vx: Math.cos(a) * (1 + Math.random() * 2),
            vy: Math.sin(a) * (1 + Math.random() * 2) - 1.5,
            char: runeChars[Math.floor(Math.random() * runeChars.length)],
            size: 14 + Math.random() * 20,
            life: 1, decay: 0.003 + Math.random() * 0.005,
            hue: Math.random() < 0.4 ? 42 : Math.floor(Math.random() * 15),
          });
        }
        for (const r of this.runes) {
          r.x += r.vx; r.y += r.vy;
          r.life -= r.decay; r.vy += 0.02;
          if (r.life <= 0) continue;
          ctx.globalAlpha = r.life * 0.7;
          ctx.fillStyle = `hsl(${r.hue}, 95%, ${55 + r.life * 20}%)`;
          if (glow > 0) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = glow; }
          ctx.font = `bold ${r.size}px sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(r.char, r.x, r.y);
          ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1;
      }

      // ---- Text layer ----
      const dur = p ? p.duration : 4000;
      const textFade = Math.min(elapsed / 500, 1);
      const textVisible = elapsed < dur - 500 ? textFade : Math.max(0, 1 - (elapsed - (dur - 500)) / 500);
      if (textVisible > 0) {
        ctx.globalAlpha = textVisible;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

        if (this.isDivine) {
          // Divine tier: larger, more glorious text
          ctx.fillStyle = '#ffd700';
          ctx.font = 'bold 52px sans-serif';
          ctx.shadowColor = 'rgba(255,215,0,0.7)'; ctx.shadowBlur = 30;
          ctx.shadowBlur = 0;
          // Subtle golden stroke
          ctx.strokeStyle = 'rgba(255,215,0,0.3)';
          ctx.lineWidth = 1;

          ctx.fillStyle = '#ff4444';
          ctx.font = 'bold 26px sans-serif';
          ctx.shadowColor = 'rgba(255,0,0,0.5)'; ctx.shadowBlur = 15;
          ctx.fillText(`扣除 ${this.deduction} 分`, w / 2, cy + 5);
          ctx.shadowBlur = 0;

          ctx.fillStyle = '#ff2222';
          ctx.font = 'bold 22px sans-serif';
          ctx.shadowColor = 'rgba(255,0,0,0.4)'; ctx.shadowBlur = 10;
          ctx.fillText(`「${this.purpose}」`, w / 2, cy + 55);
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = '#ffd700';
          ctx.font = 'bold 38px sans-serif';
          if (glow > 0) { ctx.shadowColor = 'rgba(255,215,0,0.5)'; ctx.shadowBlur = glow * 1.5; }
          ctx.shadowBlur = 0;

          ctx.fillStyle = '#ff2222';
          ctx.font = 'bold 20px sans-serif';
          ctx.fillText(`扣除 ${this.deduction} 分`, w / 2, cy);

          ctx.fillStyle = '#ff0000';
          ctx.font = '18px sans-serif';
          ctx.fillText(`「${this.purpose}」`, w / 2, cy + 45);
        }

        ctx.globalAlpha = 1;
      }
    },

    stop() { this.running = false; },
  };

  // ============================================================
  //  UI MANAGER
  // ============================================================
  const UI = {
    selectedScore: null,
    selectedEvent: null,

    // ---- View Routing ----
    showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const el = document.getElementById(viewId);
      if (el) el.classList.add('active');
    },

    // ---- Score Display ----
    updateScoreDisplay() {
      const d = StateManager.data;
      const rank = StateManager.getRank(d.totalScore);
      const el = document.getElementById('score-display');
      const num = Number.isInteger(d.totalScore) ? d.totalScore.toString() : d.totalScore.toFixed(1);
      if (rank) {
        const textColor = rank.level <= 6 ? '#ffffff' : '#ffd700';
        const bgColor = rank.color + '66'; // semi-transparent
        el.innerHTML = `<span class="score-num">${num}</span> <span class="rank-name" style="background:${bgColor};color:${textColor};border:1px solid ${rank.color};">${rank.name}</span>`;
      } else if (d.totalScore < 0) {
        el.innerHTML = `<span class="score-num" style="color:#ff5252">${num}</span> <span class="no-rank">—</span>`;
      } else {
        el.innerHTML = `<span class="score-num">${num}</span>`;
      }
    },

    // ---- Score Buttons ----
    renderScoreButtons() {
      const grid = document.getElementById('score-grid');
      grid.innerHTML = '';
      const presets = StateManager.data.scorePresets;
      for (const val of presets) {
        const btn = document.createElement('button');
        btn.className = 'score-btn' + (val < 0 ? ' neg' : '');
        btn.textContent = val > 0 ? '+' + val : val.toString();
        btn.dataset.value = val;
        btn.addEventListener('click', () => this.selectScore(val, btn));
        grid.appendChild(btn);
      }
    },

    selectScore(val, btn) {
      this.selectedScore = val;
      document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected'));
      if (btn) btn.classList.add('selected');
      document.getElementById('custom-score').value = '';
      this.updateConfirmBtn();
    },

    // ---- Event Buttons ----
    renderEventList() {
      const list = document.getElementById('event-list');
      list.innerHTML = '';
      const presets = StateManager.data.eventPresets;
      for (const ev of presets) {
        const btn = document.createElement('button');
        btn.className = 'event-btn';
        btn.textContent = ev;
        btn.dataset.event = ev;
        btn.addEventListener('click', () => this.selectEvent(ev, btn));
        list.appendChild(btn);
      }
    },

    selectEvent(ev, btn) {
      this.selectedEvent = ev;
      document.querySelectorAll('.event-btn').forEach(b => b.classList.remove('selected'));
      if (btn) btn.classList.add('selected');
      document.getElementById('custom-event').value = '';
      this.updateConfirmBtn();
    },

    // ---- Confirm Button ----
    updateConfirmBtn() {
      const btn = document.getElementById('btn-confirm');
      btn.disabled = (this.selectedScore === null || this.selectedEvent === null);
    },

    // ---- Prayer Button ----
    updatePrayerBtn() {
      const btn = document.getElementById('btn-prayer');
      btn.disabled = StateManager.data.totalScore < 30;
    },

    // ---- Modal Management ----
    openModal(id) {
      document.getElementById(id).classList.add('active');
    },

    closeModal(id) {
      document.getElementById(id).classList.remove('active');
    },

    // ---- Score Edit Modal ----
    renderScoreEdit() {
      const list = document.getElementById('score-edit-list');
      list.innerHTML = '';
      const presets = StateManager.data.scorePresets;
      presets.forEach((val, i) => {
        const div = document.createElement('div');
        div.className = 'preset-edit-item';
        div.innerHTML = `
          <button class="btn-move" data-i="${i}" data-dir="-1">▲</button>
          <button class="btn-move" data-i="${i}" data-dir="1">▼</button>
          <div class="val"><input type="text" value="${val}" data-i="${i}" class="edit-score-val" /></div>
          <button class="btn-del" data-i="${i}">✕</button>
        `;
        list.appendChild(div);
      });
    },

    saveScorePresets() {
      const inputs = document.querySelectorAll('.edit-score-val');
      const values = [];
      for (const inp of inputs) {
        const v = parseFloat(inp.value);
        if (!isNaN(v) && v !== 0) values.push(v);
      }
      StateManager.data.scorePresets = values;
      StateManager.save();
      this.closeModal('modal-score-edit');
      this.renderScoreButtons();
    },

    // ---- Event Edit Modal ----
    renderEventEdit() {
      const list = document.getElementById('event-edit-list');
      list.innerHTML = '';
      const presets = StateManager.data.eventPresets;
      presets.forEach((val, i) => {
        const div = document.createElement('div');
        div.className = 'preset-edit-item';
        div.innerHTML = `
          <button class="btn-move" data-i="${i}" data-dir="-1">▲</button>
          <button class="btn-move" data-i="${i}" data-dir="1">▼</button>
          <div class="val"><input type="text" value="${val}" data-i="${i}" class="edit-event-val" /></div>
          <button class="btn-del" data-i="${i}">✕</button>
        `;
        list.appendChild(div);
      });
    },

    saveEventPresets() {
      const inputs = document.querySelectorAll('.edit-event-val');
      const values = [];
      for (const inp of inputs) {
        const v = inp.value.trim();
        if (v) values.push(v);
      }
      StateManager.data.eventPresets = values;
      StateManager.save();
      this.closeModal('modal-event-edit');
      this.renderEventList();
    },

    // ---- History Chart Controls ----
    renderHistory() {
      HistoryChart.updateData();
      HistoryChart.render();
    },

    // ---- Full refresh ----
    refreshAll() {
      this.updateScoreDisplay();
      this.renderScoreButtons();
      this.renderEventList();
      this.updateConfirmBtn();
      this.updatePrayerBtn();
      AxisRenderer.renderImmediate(StateManager.data.totalScore);
    },
  };

  // ============================================================
  //  EVENT BINDING
  // ============================================================
  function bindEvents() {

    // ---- Confirm ----
    document.getElementById('btn-confirm').addEventListener('click', () => {
      if (UI.selectedScore === null || UI.selectedEvent === null) return;
      const delta = UI.selectedScore;
      const event = UI.selectedEvent;
      StateManager.addHistory(delta, event, 'record');
      UI.updateScoreDisplay();
      UI.updatePrayerBtn();
      AxisRenderer.animateToScore(StateManager.data.totalScore);
      // Clear selection
      UI.selectedScore = null;
      UI.selectedEvent = null;
      document.querySelectorAll('.score-btn, .event-btn').forEach(b => b.classList.remove('selected'));
      UI.updateConfirmBtn();
    });

    // ---- Custom score input ----
    document.getElementById('custom-score').addEventListener('input', function() {
      const v = parseFloat(this.value);
      if (!isNaN(v) && v !== 0) {
        UI.selectedScore = v;
        document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected'));
      } else {
        UI.selectedScore = null;
      }
      UI.updateConfirmBtn();
    });

    // ---- Custom event input ----
    document.getElementById('custom-event').addEventListener('input', function() {
      const v = this.value.trim();
      if (v) {
        UI.selectedEvent = v;
        document.querySelectorAll('.event-btn').forEach(b => b.classList.remove('selected'));
      } else {
        UI.selectedEvent = null;
      }
      UI.updateConfirmBtn();
    });

    // ---- Edit buttons ----
    document.getElementById('btn-edit-scores').addEventListener('click', () => {
      UI.renderScoreEdit();
      UI.openModal('modal-score-edit');
    });
    document.getElementById('btn-edit-events').addEventListener('click', () => {
      UI.renderEventEdit();
      UI.openModal('modal-event-edit');
    });

    // ---- Modal: Score edit actions ----
    document.getElementById('score-add-btn').addEventListener('click', () => {
      const inp = document.getElementById('score-add-input');
      const v = parseFloat(inp.value);
      if (!isNaN(v) && v !== 0) {
        StateManager.data.scorePresets.push(v);
        UI.renderScoreEdit();
        inp.value = '';
      }
    });
    document.getElementById('modal-score-edit').addEventListener('click', function(e) {
      const target = e.target;
      // Move
      if (target.classList.contains('btn-move')) {
        const i = parseInt(target.dataset.i);
        const dir = parseInt(target.dataset.dir);
        const arr = StateManager.data.scorePresets;
        const ni = i + dir;
        if (ni >= 0 && ni < arr.length) {
          [arr[i], arr[ni]] = [arr[ni], arr[i]];
          UI.renderScoreEdit();
        }
      }
      // Delete
      if (target.classList.contains('btn-del')) {
        const i = parseInt(target.dataset.i);
        StateManager.data.scorePresets.splice(i, 1);
        UI.renderScoreEdit();
      }
    });

    // ---- Modal: Event edit actions ----
    document.getElementById('event-add-btn').addEventListener('click', () => {
      const inp = document.getElementById('event-add-input');
      const v = inp.value.trim();
      if (v) {
        StateManager.data.eventPresets.push(v);
        UI.renderEventEdit();
        inp.value = '';
      }
    });
    document.getElementById('modal-event-edit').addEventListener('click', function(e) {
      const target = e.target;
      if (target.classList.contains('btn-move')) {
        const i = parseInt(target.dataset.i);
        const dir = parseInt(target.dataset.dir);
        const arr = StateManager.data.eventPresets;
        const ni = i + dir;
        if (ni >= 0 && ni < arr.length) {
          [arr[i], arr[ni]] = [arr[ni], arr[i]];
          UI.renderEventEdit();
        }
      }
      if (target.classList.contains('btn-del')) {
        const i = parseInt(target.dataset.i);
        StateManager.data.eventPresets.splice(i, 1);
        UI.renderEventEdit();
      }
    });

    // ---- Close modals on backdrop click ----
    document.querySelectorAll('.modal-overlay').forEach(el => {
      el.addEventListener('click', function(e) {
        if (e.target === this) {
          this.classList.remove('active');
        }
      });
    });

    // ---- Prayer ----
    document.getElementById('btn-prayer').addEventListener('click', () => {
      UI.showView('view-prayer');
      document.getElementById('prayer-purpose').value = '';
      document.getElementById('prayer-amount').value = '';
    });

    document.getElementById('btn-prayer-cancel').addEventListener('click', () => {
      UI.showView('view-main');
    });

    document.getElementById('btn-prayer-confirm').addEventListener('click', () => {
      const purpose = document.getElementById('prayer-purpose').value.trim();
      const amount = parseFloat(document.getElementById('prayer-amount').value);
      if (!purpose) { alert('请输入祈福目的'); return; }
      if (isNaN(amount) || amount <= 0) { alert('请输入正数的扣减分数'); return; }
      if (StateManager.data.totalScore < 30) { alert('业力值不足，无法祈福'); return; }

      // Record the prayer
      StateManager.addHistory(-amount, '祈福：' + purpose, 'prayer');
      UI.updateScoreDisplay();
      UI.updatePrayerBtn();

      // Hide form, show particles
      const form = document.querySelector('.prayer-form');
      form.style.display = 'none';

      const rank = StateManager.getRank(StateManager.data.totalScore);
      const rankLevel = rank ? rank.level : 1;
      // 用 requestAnimationFrame 确保布局已稳定后再读取画布尺寸
      requestAnimationFrame(() => {
        ParticleEngine.start(amount, purpose, rankLevel, () => {
          form.style.display = '';
          UI.showView('view-main');
          AxisRenderer.animateToScore(StateManager.data.totalScore);
        });
      });
    });

    // ---- History ----
    document.getElementById('btn-history').addEventListener('click', () => {
      UI.showView('view-history');
      UI.renderHistory();
    });

    document.getElementById('hist-back').addEventListener('click', () => {
      UI.showView('view-main');
      AxisRenderer.renderImmediate(StateManager.data.totalScore);
    });

    // ---- History: view mode ----
    document.querySelectorAll('#view-history .hist-controls button[data-mode]').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#view-history .hist-controls button[data-mode]').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        HistoryChart.viewMode = this.dataset.mode;
        HistoryChart.updateData();
        HistoryChart.render();
      });
    });

    // ---- History: export ----
    document.getElementById('btn-export-csv').addEventListener('click', () => {
      const data = StateManager.exportData('csv');
      const blob = new Blob(['﻿' + data], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'karma_data.csv'; a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btn-export-json').addEventListener('click', () => {
      const data = StateManager.exportData('json');
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'karma_data.json'; a.click();
      URL.revokeObjectURL(url);
    });

    // ---- History: import ----
    document.getElementById('btn-import').addEventListener('click', () => {
      document.getElementById('file-input').click();
    });
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      if (ext !== 'json' && ext !== 'csv') { alert('请选择 .json 或 .csv 文件'); return; }
      const reader = new FileReader();
      reader.onload = function(ev) {
        const ok = StateManager.importData(ev.target.result, ext === 'json' ? 'json' : 'csv');
        if (ok) {
          alert('导入成功');
          UI.refreshAll();
          if (document.getElementById('view-history').classList.contains('active')) {
            UI.renderHistory();
          }
        } else {
          alert('导入失败，文件格式不正确');
        }
      };
      reader.readAsText(file);
      this.value = '';
    });

    // ---- History: chart interactions ----
    const chartCanvas = document.getElementById('chart-canvas');

    chartCanvas.addEventListener('mousedown', (e) => {
      HistoryChart.handlePanStart(e.clientX);
    });

    chartCanvas.addEventListener('mousemove', (e) => {
      const rect = chartCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const point = HistoryChart.getHoveredPoint(mx, my);

      if (HistoryChart.isPanning) {
        HistoryChart.handlePanMove(e.clientX);
        return;
      }

      const tooltip = document.getElementById('tooltip');
      if (point) {
        const d = new Date(point.timestamp);
        const timeStr = d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0') + ' ' +
          String(d.getHours()).padStart(2, '0') + ':' +
          String(d.getMinutes()).padStart(2, '0');
        const deltaStr = (point.delta >= 0 ? '+' : '') + point.delta.toFixed(1);
        tooltip.innerHTML = `
          <div class="tt-row"><span class="tt-label">时间</span><span class="tt-val">${timeStr}</span></div>
          <div class="tt-row"><span class="tt-label">变动</span><span class="tt-val ${point.delta >= 0 ? 'pos' : 'neg'}">${deltaStr}</span></div>
          <div class="tt-row"><span class="tt-label">事件</span><span class="tt-val">${point.event || '—'}</span></div>
          <div class="tt-row"><span class="tt-label">总分</span><span class="tt-val">${point.totalAfter.toFixed(1)}</span></div>
        `;
        tooltip.classList.add('visible');
        // Position tooltip
        const tx = Math.min(e.clientX + 16, window.innerWidth - 300);
        const ty = Math.max(10, e.clientY - 60);
        tooltip.style.left = tx + 'px';
        tooltip.style.top = ty + 'px';
      } else {
        tooltip.classList.remove('visible');
      }
    });

    chartCanvas.addEventListener('mouseup', () => {
      HistoryChart.handlePanEnd();
    });

    chartCanvas.addEventListener('mouseleave', () => {
      HistoryChart.handlePanEnd();
      document.getElementById('tooltip').classList.remove('visible');
    });

    chartCanvas.addEventListener('wheel', (e) => {
      HistoryChart.handleWheel(e);
    }, { passive: false });

    // ---- Window resize ----
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        AxisRenderer.handleResize();
        if (document.getElementById('view-history').classList.contains('active')) {
          HistoryChart.render();
        }
      }, 150);
    });

    // ---- Keyboard: Enter on custom inputs ----
    document.getElementById('custom-score').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-confirm').click();
    });
    document.getElementById('custom-event').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-confirm').click();
    });
    document.getElementById('prayer-amount').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-prayer-confirm').click();
    });
  }

  // ============================================================
  //  INIT
  // ============================================================
  function init() {
    StateManager.load();
    AxisRenderer.init(document.getElementById('axis-canvas'));
    HistoryChart.init(document.getElementById('chart-canvas'));
    ParticleEngine.init(document.getElementById('prayer-canvas'));

    UI.refreshAll();
    bindEvents();

    // Render axis
    setTimeout(() => {
      AxisRenderer.renderImmediate(StateManager.data.totalScore);
    }, 50);
  }

  // ============================================================
  //  PUBLIC API (for inline onclick)
  // ============================================================
  return {
    init,
    openModal: (id) => UI.openModal(id),
    closeModal: (id) => UI.closeModal(id),
    saveScorePresets: () => UI.saveScorePresets(),
    saveEventPresets: () => UI.saveEventPresets(),
  };

})();

// ---- Boot ----
document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
